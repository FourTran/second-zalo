name: Validate React Native starter
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests (pure domain logic, no device)
        run: npm run test:unit
      - name: TypeScript validation
        run: npm run typecheck
      - name: Validate Expo config
        run: npx expo config --json > /tmp/zalo-hub-expo-config.json
      - name: Check iOS JavaScript bundle (not a native build)
        run: npx expo export --platform ios --output-dir /tmp/zalo-hub-ios-bundle
      - name: Check Android JavaScript bundle (not a native build)
        run: npx expo export --platform android --output-dir /tmp/zalo-hub-android-bundle
