name: Validate React Native starter
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests (no real Zalo connection)
        run: npm run test:unit
      - name: Web feasibility unit tests
        run: npm run test:web
      - name: Build nonproduction static Worker bundle
        run: npm run web:build-worker && node --check dist/zalo-hub-feasibility-worker.js
      - name: TypeScript validation
        run: npm run typecheck
      - name: Assert prototype release remains blocked
        run: npm run release:check
      - name: Validate Expo configuration
        run: npx expo config --json > /tmp/zalo-hub-expo-config.json
      - name: Check iOS JS bundle (not signed native binary)
        run: npx expo export --platform ios --output-dir /tmp/zalo-hub-ios-bundle
      - name: Check Android JS bundle (not signed native binary)
        run: npx expo export --platform android --output-dir /tmp/zalo-hub-android-bundle
